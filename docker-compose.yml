services:
  minio:
    image: pgsty/silo
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    expose:
      - "9000"
      - "9001"
    volumes:
      - minio_data:/data
    networks:
      - dokploy-network
    labels:
      - traefik.docker.network=dokploy-network
    restart: unless-stopped

volumes:
  minio_data:

networks:
  dokploy-network:
    external: true
